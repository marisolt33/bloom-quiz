<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bloom — Índice Metamorfosis</title>
<style>
  :root{
    --ink:#241521;
    --paper:#FFFCF7;
    --plum:#452751;
    --plum-deep:#2E1836;
    --coral:#E85D6B;
    --coral-dark:#C6455A;
    --coral-tint:#FBE1DF;
    --signal-sueno:#F1B90C;
    --signal-energia:#FF8A3D;
    --signal-animo:#F0529C;
    --signal-ciclo:#C6455A;
    --signal-otros:#8467A6;
    --sage:var(--signal-otros);
    --sage-tint:#EFE6EF;
    --mauve:#8C7A8A;
    --card:#FBF7EF;
    --card-line:#EFE6D8;
    --sev-1:var(--signal-ciclo);
    --sev-2:var(--signal-energia);
    --sev-3:var(--signal-sueno);
    --sev-4:var(--signal-otros);
    --sev-5:#B9AFAE;
    --shadow: 0 20px 45px -20px rgba(46,24,54,.35);
    --radius-lg:22px;
    --radius-md:14px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:linear-gradient(180deg, var(--sage-tint) 0%, var(--card) 45%, var(--paper) 100%);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:28px 12px;
    color:var(--ink);
  }
  h1,h2,h3{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif; text-wrap:balance; margin:0;}
  p{margin:0;}
  button{font-family:inherit;}
  .app{
    width:100%;
    max-width:460px;
    background:var(--paper);
    border-radius:32px;
    box-shadow:var(--shadow);
    overflow:hidden;
    position:relative;
    min-height:780px;
    display:flex;
    flex-direction:column;
    border:1px solid rgba(46,24,54,.06);
  }
  .app.theme-dark{ background:radial-gradient(120% 100% at 50% 0%, var(--plum) 0%, var(--plum-deep) 100%); color:#fff; }
  .app.theme-checkout{ background:#fff; }

  /* ---- chrome: survey header ---- */
  .chrome-top{ display:flex; align-items:center; justify-content:space-between; padding:20px 20px 0; }
  .brand{ font-family:Georgia,serif; font-weight:700; font-size:19px; color:var(--coral-dark); display:flex; align-items:center; gap:6px; }
  .back-btn{ background:none; border:none; font-size:20px; color:var(--ink); cursor:pointer; padding:4px 8px; border-radius:8px; }
  .back-btn:focus-visible, .skip-btn:focus-visible, .option:focus-visible, .btn-primary:focus-visible, .btn-ghost:focus-visible { outline:2px solid var(--coral); outline-offset:2px; }
  .skip-btn{ background:none; border:none; font-size:15px; color:var(--mauve); cursor:pointer; }
  .progress-track{ height:6px; background:var(--card-line); border-radius:6px; margin:14px 20px 0; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--coral); border-radius:6px; transition:width .35s ease; }

  .screen{ flex:1; display:flex; flex-direction:column; padding:22px 22px 110px; overflow-y:auto; }
  .screen.center{ justify-content:center; align-items:center; text-align:center; }
  .eyebrow{ font-size:13px; letter-spacing:.04em; color:var(--mauve); font-weight:600; margin-bottom:6px; }
  .q-title{ font-size:26px; line-height:1.25; font-weight:700; color:var(--ink); margin-bottom:8px; }
  .q-sub{ font-size:15px; color:var(--mauve); line-height:1.5; margin-bottom:22px; }
  .theme-dark .q-title{ color:#fff; }
  .theme-dark .q-sub{ color:#D9C9E0; }

  .options{ display:flex; flex-direction:column; gap:12px; }
  .option{
    background:var(--card); border:2px solid transparent; border-radius:var(--radius-md);
    padding:16px 16px; text-align:left; cursor:pointer; font-size:16px; color:var(--ink);
    display:flex; align-items:center; gap:12px; transition:border-color .15s, background .15s;
  }
  .option:hover{ background:var(--card-line); }
  .option.selected{ border-color:var(--coral); background:var(--coral-tint); }
  .option .mark{ width:20px; height:20px; border-radius:50%; border:2px solid var(--card-line); flex:0 0 auto; display:flex; align-items:center; justify-content:center; }
  .option.selected .mark{ border-color:var(--coral); background:var(--coral); }
  .option.selected .mark::after{ content:"✓"; color:#fff; font-size:12px; }
  .option .body{ flex:1; }
  .option .opt-title{ font-weight:600; }
  .option .opt-sub{ display:block; font-size:13px; color:var(--mauve); margin-top:3px; }
  .option .opt-title{ display:block; }
  .option[data-shape="square"] .mark{ border-radius:6px; }

  .sev-bars{ display:flex; align-items:flex-end; gap:2px; width:22px; height:18px; }
  .sev-bars i{ display:block; width:4px; border-radius:2px; background:var(--card-line); }

  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .age-card{ background:#fff; border:2px solid var(--card-line); border-radius:var(--radius-md); padding:14px; text-align:center; cursor:pointer; transition:border-color .15s, background .15s; }
  .age-card:hover{ border-color:var(--sage); }
  .age-card.selected{ border-color:var(--coral); background:var(--coral-tint); }
  .age-card svg{ width:56px; height:70px; }
  .age-card .lbl{ margin-top:8px; font-weight:600; font-size:15px; background:var(--sage-tint); border-radius:8px; padding:6px 0; }

  .btn-primary{
    display:block; text-align:center; text-decoration:none; box-sizing:border-box;
    position:absolute; left:22px; right:22px; bottom:22px;
    background:var(--coral); color:#fff; border:none; border-radius:100px;
    padding:16px 0; font-size:16px; font-weight:700; cursor:pointer;
    box-shadow:0 10px 24px -10px rgba(200,60,80,.55);
  }
  .btn-primary:disabled{ background:#F0B7BC; box-shadow:none; cursor:not-allowed; }
  .btn-primary.static{ position:static; width:100%; margin-top:26px; }
  .btn-ghost{ background:none; border:none; color:var(--mauve); text-decoration:underline; cursor:pointer; font-size:14px; margin-top:14px; }
  .theme-dark .btn-ghost{ color:#D9C9E0; }

  /* modal */
  .modal-backdrop{ position:absolute; inset:0; background:rgba(28,15,34,.62); display:flex; align-items:center; justify-content:center; padding:30px; z-index:20; }
  .modal-card{ background:#fff; color:var(--ink); border-radius:20px; padding:28px 22px; text-align:center; max-width:340px; }
  .modal-card h3{ font-size:19px; margin-bottom:18px; line-height:1.35; }
  .modal-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .modal-actions button{ border:none; border-radius:100px; padding:11px 22px; font-weight:700; font-size:15px; cursor:pointer; }
  .modal-actions .yes{ background:var(--coral); color:#fff; }
  .modal-actions .no{ background:var(--sage-tint); color:var(--ink); }
  .gate-actions{ display:flex; flex-direction:column; gap:10px; margin-top:10px; }
  .gate-exit{ background:var(--coral); color:#fff; }
  .gate-continue{ background:none; color:var(--ink); font-weight:700; text-decoration:underline; }

  /* year input */
  .year-boxes{ display:flex; gap:10px; margin-bottom:8px; }
  .year-boxes input{
    width:56px; height:64px; text-align:center; font-size:24px; font-weight:700;
    border:2px solid var(--card-line); border-radius:12px; background:var(--card); color:var(--ink);
  }
  .year-boxes input:focus{ outline:none; border-color:var(--coral); }

  /* calendar */
  .cal-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .cal-arrow{ background:var(--card); border:none; width:34px; height:34px; border-radius:50%; font-size:18px; line-height:1; cursor:pointer; color:var(--ink); }
  .cal-arrow:disabled{ opacity:.3; cursor:not-allowed; }
  .cal-head-label{ font-weight:700; font-size:15px; text-transform:capitalize; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
  .cal-day{ aspect-ratio:1; border-radius:50%; border:none; background:var(--card); font-size:14px; cursor:pointer; }
  .cal-day.selected{ background:var(--coral); color:#fff; }
  .cal-day:disabled{ opacity:.25; cursor:not-allowed; }

  /* social proof / onboarding illustration blocks */
  .illus{ width:100%; border-radius:20px; background:var(--sage-tint); border:1px solid rgba(69,39,81,.08); box-shadow:0 10px 30px -14px rgba(46,24,54,.25); padding:34px 20px; margin-bottom:22px; display:flex; align-items:center; justify-content:center; }
  .illus svg{ width:120px; height:auto; }
  .stat-line{ font-size:15px; color:var(--mauve); margin-bottom:6px; }
  .stat-big{ color:var(--coral-dark); font-weight:700; }
  .avatars{ position:relative; width:280px; height:280px; margin:26px auto; }
  .avatars::before, .avatars::after{ content:""; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); border:1px solid rgba(46,24,54,.08); border-radius:50%; }
  .avatars::before{ width:190px; height:190px; }
  .avatars::after{ width:250px; height:250px; }
  .avatars-center{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:34px; z-index:1; }
  .avatar{ width:74px; height:74px; border-radius:50%; position:absolute; border:3px solid #fff; box-shadow:0 6px 16px -6px rgba(0,0,0,.25); overflow:hidden; background:var(--card); }

  .section-badge{ display:inline-block; background:var(--sage-tint); color:var(--plum); font-weight:700; font-size:13px; padding:5px 12px; border-radius:100px; margin-bottom:14px; }

  /* processing */
  .pulse-bars{ display:flex; gap:6px; align-items:flex-end; height:46px; margin-bottom:18px; }
  .pulse-bars i{ width:9px; border-radius:5px; background:var(--coral); animation:pulse 1.1s ease-in-out infinite; }
  .pulse-bars i:nth-child(1){height:60%; animation-delay:0s;}
  .pulse-bars i:nth-child(2){height:35%; animation-delay:.15s;}
  .pulse-bars i:nth-child(3){height:100%; animation-delay:.3s;}
  .pulse-bars i:nth-child(4){height:50%; animation-delay:.45s;}
  @keyframes pulse{ 0%,100%{ transform:scaleY(.6); opacity:.7;} 50%{ transform:scaleY(1); opacity:1;} }
  @media (prefers-reduced-motion: reduce){ .pulse-bars i{ animation:none; } }

  .testimonial{ background:#fff; color:var(--ink); border-radius:18px; padding:22px; max-width:320px; margin:0 auto; position:relative; }
  .testimonial::after{ content:""; position:absolute; left:50%; bottom:-10px; transform:translateX(-50%); border-width:10px 10px 0; border-style:solid; border-color:#fff transparent transparent; }
  .testimonial-head{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .t-avatar{ width:40px; height:40px; border-radius:50%; overflow:hidden; flex:0 0 auto; box-shadow:0 2px 6px rgba(46,24,54,.18); }
  .t-avatar-sm{ width:30px; height:30px; border-radius:50%; overflow:hidden; flex:0 0 auto; box-shadow:0 2px 6px rgba(46,24,54,.18); }
  .stars{ color:var(--sev-3); letter-spacing:2px; }
  .testimonial q{ font-size:15px; line-height:1.5; }
  .testimonial .who{ margin-top:12px; font-size:13px; color:var(--mauve); }
  .origin-card{ background:var(--sage-tint); }
  .origin-card .who{ color:var(--plum); font-weight:700; }

  /* gift */
  .gift-box{ font-size:110px; text-align:center; margin:30px 0; transition:transform .4s ease; }
  .confetti-wrap{ position:relative; }
  .confetti{ position:absolute; width:10px; height:14px; border-radius:2px; top:-10px; animation:fall 2.6s ease-in forwards; }
  @keyframes fall{ to{ transform:translateY(420px) rotate(220deg); opacity:0; } }
  @media (prefers-reduced-motion: reduce){ .confetti{ animation:none; opacity:0; } }
  .count-card{ background:linear-gradient(135deg,var(--coral),var(--coral-dark)); color:#fff; border-radius:24px; padding:34px 20px; text-align:center; width:220px; margin:0 auto; box-shadow:0 20px 40px -14px rgba(200,60,80,.6); }
  .count-num{ font-size:64px; font-weight:800; font-variant-numeric:tabular-nums; }
  .count-lbl{ font-weight:700; margin-top:4px; }
  .strike{ text-decoration:line-through; opacity:.6; margin-right:6px; }

  .gauge-card{ width:100%; background:#fff; border-radius:22px; padding:26px 20px 22px; box-shadow:var(--shadow); text-align:center; color:var(--ink); }
  .gauge-wrap{ display:flex; justify-content:center; }
  .gauge-number{ font-family:Georgia,serif; font-size:44px; font-weight:800; margin-top:-30px; color:var(--ink); }
  .gauge-tag{ display:inline-block; font-weight:700; font-size:14px; padding:5px 14px; border-radius:100px; color:#fff; margin-top:4px; }
  .gauge-band-title{ font-size:19px; font-weight:700; margin-top:10px; }
  .gauge-legend{ display:flex; justify-content:space-between; margin-top:16px; gap:4px; }
  .gauge-legend span{ flex:1; font-size:10.5px; color:var(--mauve); font-weight:600; line-height:1.3; }
  .gauge-legend span.active{ color:var(--ink); font-weight:800; }
  .gauge-desc{ font-size:14px; line-height:1.55; color:var(--ink); margin-top:16px; text-align:left; }
  .gauge-confirm{ font-size:14.5px; font-weight:700; color:var(--coral-dark); margin-top:14px; text-align:left; }
  .gauge-method{ font-size:11.5px; color:var(--mauve); line-height:1.5; margin-top:14px; text-align:left; border-top:1px solid var(--card-line); padding-top:12px; }
  .gauge-disclaimer{ font-size:11px; color:var(--mauve); line-height:1.5; margin-top:10px; text-align:left; font-style:italic; }

  /* pricing */
  .plan-option{ border:2px solid var(--card-line); border-radius:16px; padding:16px; margin-bottom:12px; cursor:pointer; background:#fff; }
  .plan-option.selected{ border-color:var(--coral); background:var(--coral-tint); }
  .plan-badge{ display:inline-block; background:var(--sage); color:#fff; font-size:11px; font-weight:700; padding:3px 10px; border-radius:100px; margin-bottom:8px; }
  .plan-row{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .plan-name{ font-weight:700; font-size:16px; }
  .plan-price{ font-weight:800; font-size:19px; font-family:Georgia,serif; white-space:nowrap; }
  .plan-price small{ font-size:11.5px; font-weight:600; color:var(--mauve); }
  .btn-primary.compact{ font-size:13.5px; padding:14px 0; }
  .checklist div{ display:flex; gap:8px; align-items:flex-start; font-size:14px; margin-bottom:8px; }
  .checklist .tick{ color:var(--sage); font-weight:800; }

  .rating-row{ display:flex; align-items:center; gap:8px; justify-content:center; margin:22px 0 12px; }
  .rating-stars{ color:var(--sev-3); letter-spacing:2px; }
  .mini-testimonial{ background:var(--card); border-radius:14px; padding:16px; font-size:14px; line-height:1.5; margin-bottom:18px; }
  .mini-testimonial .who-row{ display:flex; align-items:center; gap:8px; margin-top:10px; }
  .mini-testimonial .who{ font-size:12.5px; color:var(--mauve); font-weight:600; }
  .authority-tag{ text-align:center; font-family:Georgia,serif; font-weight:700; font-size:15px; color:var(--ink); margin:22px 0; line-height:1.4; }

  .trust-badges{ display:flex; gap:10px; margin:16px 0; }
  .trust-badge{ flex:1; text-align:center; background:var(--card); border-radius:12px; padding:12px 6px; font-size:11px; font-weight:700; color:var(--ink); }
  .trust-badge .glyph{ font-size:18px; display:block; margin-bottom:4px; }

  .guarantee-box{ background:var(--sage-tint); border-radius:16px; padding:18px; margin:18px 0; display:flex; gap:14px; align-items:flex-start; }
  .guarantee-seal{ flex:0 0 auto; width:56px; height:56px; border-radius:50%; background:var(--sage); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:9.5px; font-weight:800; line-height:1.25; text-align:center; }

  .fine-print{ font-size:12px; color:var(--mauve); line-height:1.6; margin-top:16px; }

  .consent-row{ display:flex; align-items:flex-start; gap:12px; cursor:pointer; font-size:14px; line-height:1.55; color:var(--ink); }
  .consent-row input[type="checkbox"]{ accent-color:var(--coral); width:20px; height:20px; flex:0 0 auto; margin-top:2px; cursor:pointer; }
  .link-like{ color:var(--coral-dark); text-decoration:underline; font-weight:600; }

  .end-card{ text-align:center; }
  .end-card h1{ font-size:24px; margin-bottom:12px; }
  .demo-tag{ display:inline-block; background:var(--plum); color:#fff; font-size:11px; letter-spacing:.06em; text-transform:uppercase; padding:4px 10px; border-radius:100px; margin-bottom:14px; }
</style>

<div class="app" id="app"></div>

<script>
(function(){
  var STATE = { i:0, answers:{}, modalQueue:[], reducedMotion: window.matchMedia('(prefers-reduced-motion: reduce)').matches };

  function icon(name, size){
    size = size || 20;
    var map = {
      seed:'<svg viewBox="0 0 60 80"><path d="M30 74 V40" stroke="var(--plum)" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M30 46 C18 46 12 38 12 32 C22 32 30 38 30 46Z" fill="var(--plum)"/></svg>',
      bud:'<svg viewBox="0 0 60 80"><path d="M30 74 V30" stroke="var(--plum)" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M30 40 C16 40 10 30 10 24 C22 24 30 32 30 40Z" fill="var(--plum)"/><path d="M30 40 C44 40 50 30 50 24 C38 24 30 32 30 40Z" fill="var(--signal-otros)"/><circle cx="30" cy="18" r="9" fill="#D98C82"/></svg>',
      flower:'<svg viewBox="0 0 60 80"><path d="M30 74 V34" stroke="var(--plum)" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M30 44 C16 44 10 34 10 28 C22 28 30 36 30 44Z" fill="var(--plum)"/><circle cx="30" cy="16" r="8" fill="#E29B93"/><circle cx="19" cy="22" r="8" fill="#D98C82"/><circle cx="41" cy="22" r="8" fill="#D98C82"/><circle cx="30" cy="16" r="4" fill="var(--coral-dark)"/></svg>',
      bloom:'<svg viewBox="0 0 60 80"><path d="M30 74 V38" stroke="var(--plum)" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M30 46 C14 46 8 36 8 30 C22 30 30 38 30 46Z" fill="var(--plum)"/><circle cx="30" cy="18" r="9" fill="#E29B93"/><circle cx="17" cy="24" r="9" fill="#D98C82"/><circle cx="43" cy="24" r="9" fill="#D98C82"/><circle cx="20" cy="10" r="8" fill="#E5A89D"/><circle cx="40" cy="10" r="8" fill="#E5A89D"/><circle cx="30" cy="18" r="4.5" fill="var(--coral-dark)"/></svg>',
      womanJourney:'<svg viewBox="0 0 120 160"><path d="M42 54 C35 38 40 20 60 20 C80 20 85 38 78 54 L78 68 C78 76 42 76 42 68Z" fill="var(--plum)"/><path d="M46 36 C50 28 70 28 74 36 C68 32 52 32 46 36Z" fill="var(--plum)"/><circle cx="60" cy="42" r="17" fill="#E7B89A"/><path d="M60 66 C38 70 28 98 30 126 C31 142 40 154 60 156 C80 154 89 142 90 126 C92 98 82 70 60 66Z" fill="var(--sage)"/><path d="M46 76 C36 86 34 100 44 108" stroke="var(--plum)" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M74 76 C84 86 86 100 76 108" stroke="var(--plum)" stroke-width="6" fill="none" stroke-linecap="round"/><circle cx="60" cy="110" r="7" fill="var(--coral)"/><circle cx="51" cy="106" r="6" fill="#D98C82"/><circle cx="69" cy="106" r="6" fill="#D98C82"/><circle cx="60" cy="100" r="6" fill="#E5A89D"/></svg>',
      womanBloom:'<svg viewBox="0 0 120 160"><path d="M40 48 C35 33 40 16 60 16 C80 16 85 33 80 48 L82 74 C82 82 38 82 38 74Z" fill="var(--plum)"/><path d="M46 34 C50 26 70 26 74 34 C68 30 52 30 46 34Z" fill="var(--plum)"/><circle cx="60" cy="40" r="17" fill="#E7B89A"/><path d="M60 70 C42 74 32 100 34 124 C35 140 44 152 60 154 C76 152 85 140 86 124 C88 100 78 74 60 70Z" fill="var(--coral)" opacity="0.85"/><path d="M42 78 C25 70 14 54 12 38" stroke="var(--plum)" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M78 78 C95 70 106 54 108 38" stroke="var(--plum)" stroke-width="6" fill="none" stroke-linecap="round"/><circle cx="60" cy="16" r="8" fill="var(--sage)"/><circle cx="48" cy="22" r="8" fill="var(--plum)"/><circle cx="72" cy="22" r="8" fill="var(--plum)"/><circle cx="60" cy="16" r="4" fill="#D98C82"/></svg>'
    };
    return map[name] || '';
  }

  function logoMark(size){
    size = size || 28;
    return '<svg viewBox="0 0 100 100" width="'+size+'" height="'+size+'" style="display:block;flex:0 0 auto;">'+
      '<rect x="2" y="2" width="96" height="96" rx="22" fill="var(--plum)"/>'+
      '<circle cx="50" cy="31" r="17" fill="var(--coral)"/>'+
      '<circle cx="68" cy="44" r="17" fill="var(--coral)"/>'+
      '<circle cx="61" cy="65" r="17" fill="var(--coral)"/>'+
      '<circle cx="39" cy="65" r="17" fill="var(--coral)"/>'+
      '<circle cx="32" cy="44" r="17" fill="var(--coral)"/>'+
      '<circle cx="50" cy="49" r="13" fill="#fff"/>'+
    '</svg>';
  }

  function severityBars(level){
    var heights = [6,10,14,18];
    var colors = { 1:'var(--sev-1)',2:'var(--sev-2)',3:'var(--sev-3)',4:'var(--sev-4)',5:'var(--sev-5)' };
    var active = 5 - level;
    var html = '<span class="sev-bars">';
    for (var k=0;k<4;k++){
      var on = k < active && level < 5;
      html += '<i style="height:'+heights[k]+'px;'+(on?('background:'+colors[level]):'')+'"></i>';
    }
    html += '</span>';
    return html;
  }

  var SEVERITY_OPTS = [
    {v:'muy-severo', l:'Muy severo', lvl:1},
    {v:'severo', l:'Severo', lvl:2},

  function surveyIndexInfo(idx){
    var surveyIds = FLOW.filter(function(s){ return s.type!=='age-select' && s.chrome==='survey'; });
    var total = surveyIds.length;
    var current = FLOW[idx];
    var pos = surveyIds.indexOf(current);
    return { total: total, pos: pos+1 };
  }

  function findNext(from){
    var idx = from+1;
    while (idx < FLOW.length && typeof FLOW[idx].skip === 'function' && FLOW[idx].skip()) idx++;
    return idx;
  }
  function findPrev(from){
    var idx = from-1;
    while (idx > 0 && typeof FLOW[idx].skip === 'function' && FLOW[idx].skip()) idx--;
    return idx;
  }

  function go(idx){ STATE.i = Math.max(0, Math.min(idx, FLOW.length-1)); render(); }
  function next(){ go(findNext(STATE.i)); }
  function back(){ go(findPrev(STATE.i)); }

  function el(html){ var d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; }

  function render(){
    var step = FLOW[STATE.i];
    var app = document.getElementById('app');
    app.className = 'app ' + (step.chrome==='dark' ? 'theme-dark' : step.chrome==='checkout' ? 'theme-checkout' : '');
    app.innerHTML = '';

    var showChrome = (step.chrome === 'survey');
    if (showChrome){
      var info = surveyIndexInfo(STATE.i);
      var pct = Math.min(100, Math.round((info.pos/info.total)*100));
      var top = el('<div class="chrome-top"><button class="back-btn" aria-label="Volver">←</button><span class="brand">'+logoMark(22)+' Bloom</span><button class="skip-btn">'+(step.skippable?'Saltar':'')+'</button></div>');
      top.querySelector('.back-btn').onclick = back;
      if (step.skippable){ top.querySelector('.skip-btn').onclick = function(){ next(); }; }
      app.appendChild(top);
      var track = el('<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div>');
      app.appendChild(track);
    }

    var screen = document.createElement('div');
    screen.className = 'screen' + (['section-intro','processing','testimonial-processing','reveal','score-result','personal-plan','gift-intro','gift-anim','yesno-illus','social-proof','end'].indexOf(step.type)>-1 ? ' center' : '');
    app.appendChild(screen);

    RENDERERS[step.type](step, screen, app);
  }

  function faceAvatar(skin, hair, style){
    var hairShape;
    if (style==='bob'){
      hairShape = '<path d="M16 50 C14 20 30 4 50 4 C70 4 86 20 84 50 C84 62 78 70 78 58 C78 40 66 30 50 30 C34 30 22 40 22 58 C22 70 16 62 16 50Z" fill="'+hair+'"/>';
    } else if (style==='wavy'){
      hairShape = '<path d="M14 48 C10 18 28 2 50 2 C72 2 90 18 86 48 C90 70 84 92 76 96 C80 74 74 56 74 44 C74 30 62 22 50 22 C38 22 26 30 26 44 C26 56 20 74 24 96 C16 92 10 70 14 48Z" fill="'+hair+'"/>';
    } else if (style==='curly'){
      hairShape = '<circle cx="20" cy="40" r="13" fill="'+hair+'"/><circle cx="14" cy="55" r="11" fill="'+hair+'"/><circle cx="80" cy="40" r="13" fill="'+hair+'"/><circle cx="86" cy="55" r="11" fill="'+hair+'"/><circle cx="30" cy="18" r="13" fill="'+hair+'"/><circle cx="50" cy="10" r="14" fill="'+hair+'"/><circle cx="70" cy="18" r="13" fill="'+hair+'"/>';
    } else if (style==='updo'){
      hairShape = '<path d="M17 46 C15 18 30 4 50 4 C70 4 85 18 83 46 C83 34 70 24 50 24 C30 24 17 34 17 46Z" fill="'+hair+'"/><circle cx="50" cy="10" r="12" fill="'+hair+'"/>';
    } else {
      hairShape = '<path d="M18 42 C16 20 30 4 50 4 C70 4 84 20 82 42 C82 30 68 20 50 20 C32 20 18 30 18 42Z" fill="'+hair+'"/>';
    }
    return '<svg viewBox="0 0 100 100" width="100%" height="100%">'+hairShape+
      '<circle cx="50" cy="55" r="30" fill="'+skin+'"/>'+
      '<ellipse cx="40" cy="52" rx="3" ry="4" fill="#3a2a30"/><ellipse cx="60" cy="52" rx="3" ry="4" fill="#3a2a30"/>'+
      '<circle cx="34" cy="62" r="5" fill="#000" opacity="0.06"/><circle cx="66" cy="62" r="5" fill="#000" opacity="0.06"/>'+
      '<path d="M38 68 C44 74 56 74 62 68" stroke="#3a2a30" stroke-width="2.5" fill="none" stroke-linecap="round"/>'+
      '</svg>';
  }

  var MONTH_NAMES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

  RENDERERS['date-grid'] = function(step, screen){
    screen.appendChild(el('<h1 class="q-title">'+step.title+'</h1>'));
    screen.appendChild(el('<p class="q-sub">Si no lo recuerdas, danos una fecha aproximada. Usa las flechas para ir a un mes anterior.</p>'));

    var today = new Date();
    var view = { month: today.getMonth(), year: today.getFullYear() };
    var minDate = new Date(today.getFullYear(), today.getMonth() - 12, 1);
    var selected = STATE.answers[step.id] || null;

    var nav = el('<div class="cal-nav"><button class="cal-arrow" aria-label="Mes anterior">‹</button><span class="cal-head-label"></span><button class="cal-arrow" aria-label="Mes siguiente">›</button></div>');
    var arrows = nav.querySelectorAll('.cal-arrow');
    var prevBtn = arrows[0], nextBtn = arrows[1];
    var label = nav.querySelector('.cal-head-label');
    screen.appendChild(nav);

    var grid = el('<div class="cal-grid"></div>');
    screen.appendChild(grid);

    function renderMonth(){
      label.textContent = MONTH_NAMES[view.month] + ' ' + view.year;
      var daysInMonth = new Date(view.year, view.month + 1, 0).getDate();
      var atMin = view.year === minDate.getFullYear() && view.month === minDate.getMonth();
      var atMax = view.year === today.getFullYear() && view.month === today.getMonth();
      prevBtn.disabled = atMin;
      nextBtn.disabled = atMax;
      grid.innerHTML = '';
      for (var d = 1; d <= daysInMonth; d++){
        (function(d){
          var isFuture = atMax && d > today.getDate();
          var cell = el('<button class="cal-day"'+(isFuture?' disabled':'')+'>'+d+'</button>');
          if (selected && selected.d === d && selected.m === view.month && selected.y === view.year) cell.classList.add('selected');
          if (!isFuture){
            cell.onclick = function(){
              selected = { d:d, m:view.month, y:view.year };
              STATE.answers[step.id] = selected;
              grid.querySelectorAll('.cal-day').forEach(function(c){ c.classList.remove('selected'); });
              cell.classList.add('selected');
              setTimeout(next, STATE.reducedMotion ? 0 : 280);
            };
          }
          grid.appendChild(cell);
        })(d);
      }
    }

    prevBtn.onclick = function(){
      view.month--; if (view.month < 0){ view.month = 11; view.year--; }
      renderMonth();
    };
    nextBtn.onclick = function(){
      view.month++; if (view.month > 11){ view.month = 0; view.year++; }
      renderMonth();
    };

    renderMonth();
  };

  var SYMPTOM_KEYS = ['sym_piel','sym_pelo','sym_peso','sym_dolor','sym_sofoco','sym_sudor','sym_vejiga','sym_digest',

  var SEVERITY_POINTS = {'muy-severo':4,'severo':3,'moderado':2,'leve':1,'ninguno':0};
  var SYMPTOM_INFO = {
    sym_piel: { label:'Cambios en la piel', feature:'Registra los cambios en tu piel y descubre cómo se conectan con tus hormonas.' },
    sym_pelo: { label:'Cambios en el pelo', feature:'Lleva un registro de tu cabello y descubre estrategias de cuidado para esta etapa.' },

    sym_tristeza: { label:'Tristeza o decaimiento', feature:'Seguimiento de tu ánimo y acompañamiento emocional día a día.' },

    sym_sueno: { label:'Problemas para dormir', feature:'Seguimiento de sueño y estrategias diseñadas para descansar mejor en esta etapa.' }
  };

  function topSymptoms(n){
    var answered = SYMPTOM_KEYS
      .map(function(k){ return { key:k, pts: SEVERITY_POINTS[STATE.answers[k]] || 0 }; })
      .filter(function(s){ return STATE.answers[s.key]; });
    answered.sort(function(a,b){ return b.pts - a.pts; });
    return answered.slice(0, n).map(function(s){ return SYMPTOM_INFO[s.key]; });
  }

  function computeMetamorfosisScore(){
    var total = 0, answered = 0;
    SYMPTOM_KEYS.forEach(function(k){
      var v = STATE.answers[k];
      if (v && SEVERITY_POINTS.hasOwnProperty(v)){ total += SEVERITY_POINTS[v]; answered++; }
    });
    var max = (answered || 1) * 4;
    return Math.round((total / max) * 100);
  }

  function scoreBand(pct){
    if (pct <= 24) return { tag:'Leve', title:'Perimenopausia inicial', color:'var(--sev-4)',
      desc:'Tus respuestas muestran los primeros cambios hormonales típicos del comienzo de la perimenopausia. Es un buen momento para empezar a registrar tus síntomas antes de que se intensifiquen.' };
    if (pct <= 49) return { tag:'Moderada', title:'Perimenopausia en progreso', color:'var(--sev-3)',
      desc:'Tu cuerpo está en plena transición hormonal. La combinación de síntomas que reportaste es consistente con una perimenopausia ya en curso.' };
    if (pct <= 74) return { tag:'Alta', title:'Perimenopausia avanzada', color:'var(--sev-2)',
      desc:'Presentas varios síntomas marcados a la vez —algo frecuente en una etapa más avanzada de la perimenopausia, cuando las hormonas fluctúan con más intensidad.' };
    return { tag:'Muy alta', title:'Perimenopausia intensa', color:'var(--sev-1)',
      desc:'Tu combinación de síntomas indica una intensidad hormonal alta. Muchas mujeres en tu rango de edad describen un patrón muy similar al tuyo.' };
  }

  function buildGaugeSvg(pct){
    var cx=110, cy=112, r=88, w=16;
    function pt(theta){ var rad = theta*Math.PI/180; return { x: cx + r*Math.cos(rad), y: cy - r*Math.sin(rad) }; }
    function arc(a1,a2){ var p1=pt(a1), p2=pt(a2); return 'M '+p1.x.toFixed(1)+' '+p1.y.toFixed(1)+' A '+r+' '+r+' 0 0 1 '+p2.x.toFixed(1)+' '+p2.y.toFixed(1); }
    var bands = [[180,135,'var(--sev-4)'],[135,90,'var(--sev-3)'],[90,45,'var(--sev-2)'],[45,0,'var(--sev-1)']];
    var segs = bands.map(function(b){ return '<path d="'+arc(b[0],b[1])+'" stroke="'+b[2]+'" stroke-width="'+w+'" fill="none"/>'; }).join('');
    var needleTheta = 180 - (Math.max(0,Math.min(100,pct))/100)*180;
    var np = pt(needleTheta);
    var needle = '<line x1="'+cx+'" y1="'+cy+'" x2="'+np.x.toFixed(1)+'" y2="'+np.y.toFixed(1)+'" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/><circle cx="'+cx+'" cy="'+cy+'" r="8" fill="var(--ink)"/>';
    return '<svg viewBox="0 0 220 130" width="220" height="130">'+segs+needle+'</svg>';
  }

      var box = screen.querySelector('.gift-box');
      box.style.transform = 'scale(1.15) rotate(-4deg)';
      setTimeout(next, STATE.reducedMotion?100:500);

  RENDERERS['gift-anim'] = function(step, screen, app){
    var wrap = el('<div class="confetti-wrap"></div>');
    var card = el('<div class="count-card"><div class="count-num">1</div><div class="count-lbl">días de prueba gratis</div></div>');
    wrap.appendChild(card);
    screen.appendChild(wrap);
    var title = el('<h1 class="q-title" style="margin-top:26px;">Tu regalo: <span style="color:var(--coral-dark);">7 días gratis</span> en Bloom</h1>');
    screen.appendChild(title);
    screen.appendChild(el('<p class="q-sub" style="margin-top:10px;">Prueba Bloom sin costo durante 7 días. Al terminar, se cobra automáticamente el plan que elijas — puedes cancelar cuando quieras antes de que eso pase.</p>'));
    var btn = el('<button class="btn-primary static">Llévame a mi plan</button>');
    btn.onclick = next;
    screen.appendChild(btn);

    if (!STATE.reducedMotion){
      var colors = ['#E85D6B','#452751','#F1B90C','#8C7A8A'];
      for (var i=0;i<32;i++){
        (function(i){
          var c = document.createElement('div');
          c.className='confetti';
          c.style.left = (10+Math.random()*280)+'px';
          c.style.background = colors[i%colors.length];
          c.style.animationDelay = (Math.random()*1.3)+'s';
          wrap.appendChild(c);
        })(i);
      }
    }
    var numEl = card.querySelector('.count-num');
    if (STATE.reducedMotion){ numEl.textContent = '7'; }
    else {
      var v = 1;
      var t = setInterval(function(){
        v++; numEl.textContent = v;
        if (v>=7) clearInterval(t);
      }, 90);
    }
  };

  var HOTMART_LINKS = {
    monthly: 'https://pay.hotmart.com/S107354705P?off=osrxt36e&checkoutMode=10',
    annual: 'https://pay.hotmart.com/S107354705P?off=yn7j5l3i&checkoutMode=10'
  };

  RENDERERS['checkout'] = function(step, screen){
    screen.style.padding = '22px 22px 40px';
    screen.appendChild(el('<div class="brand" style="margin-bottom:18px;">'+logoMark(22)+' Bloom</div>'));
    screen.appendChild(el('<h1 class="q-title">Elige tu plan con Bloom</h1>'));
    screen.appendChild(el('<p class="q-sub" style="margin-top:8px;">Acompañamiento diario para tu perimenopausia: seguimiento de síntomas, tu Índice Metamorfosis actualizado y recomendaciones personalizadas.</p>'));

    var PLANS = [
      { id:'monthly', badge:null, name:'Plan mensual', price:'$7,99', unit:'/mes', note:'Equivale a $1,84 a la semana', cta:'Empezar mis 7 días gratis', url:HOTMART_LINKS.monthly },
      { id:'annual', badge:'Ahorra 37%', name:'Plan anual', price:'$59,99', unit:'/año', note:'Equivale a $5,00 al mes', cta:'Empezar mis 7 días gratis', url:HOTMART_LINKS.annual }
    ];

    var wrap = el('<div></div>');
    PLANS.forEach(function(p){
      var card = el('<div class="plan-option" style="cursor:default;">'+
        (p.badge?'<span class="plan-badge">'+p.badge+'</span>':'')+
        '<div class="plan-row"><span class="plan-name">'+p.name+'</span><span class="plan-price">'+p.price+'<small>'+p.unit+'</small></span></div>'+
        (p.note?'<div style="font-size:12px;color:var(--mauve);margin-top:4px;">'+p.note+'</div>':'')+
        '</div>');
      var btn = el('<a class="btn-primary static compact" target="_blank" rel="noopener">'+p.cta+'</a>');
      btn.href = p.url;
      card.appendChild(btn);
      wrap.appendChild(card);
    });
    screen.appendChild(wrap);

    screen.appendChild(el('<div class="checklist">\
      <div><span class="tick">✓</span> 7 días de prueba gratis, sin cobro hasta que terminen</div>\
      <div><span class="tick">✓</span> Cancela cuando quieras, incluso durante la prueba</div>\
      <div><span class="tick">✓</span> Pago 100% seguro, procesado por Hotmart, una de las plataformas líderes en América Latina</div>\
      <div><span class="tick">✓</span> Garantía de devolución de 7 días</div>\
    </div>'));

    screen.appendChild(el('<div class="rating-row"><span class="rating-stars">★★★★★</span><span style="font-size:13px;color:var(--mauve);font-weight:600;">4.8 · Valoración de la comunidad Bloom</span></div>'));
    screen.appendChild(el('<div class="mini-testimonial">"Por fin entiendo lo que me pasa. Bloom le puso nombre a síntomas que llevaba meses sin entender."<div class="who-row"><div class="t-avatar-sm"><img src="'+REAL_FACES.angela+'" alt="" style="width:100%;height:100%;object-fit:cover;"></div><div class="who">— Miembro de Bloom</div></div></div>'));
    screen.appendChild(el('<p class="authority-tag">La guía diaria para acompañar tu perimenopausia con información clara</p>'));

    screen.appendChild(el('<div class="trust-badges">\
      <div class="trust-badge"><span class="glyph">🔒</span>Cifrado SSL</div>\
      <div class="trust-badge"><span class="glyph">✓</span>Pago protegido</div>\
      <div class="trust-badge"><span class="glyph">↺</span>Cancela cuando quieras</div>\
    </div>'));

    screen.appendChild(el('<div class="guarantee-box"><div class="guarantee-seal">100%<br>7 DÍAS</div><div><b style="font-size:15px;">Garantía de reembolso del 100%</b><p style="font-size:13px;color:var(--ink);margin-top:6px;line-height:1.5;">Confiamos en Bloom. Si lo usas y no te convence, escríbenos: te devolvemos el 100% dentro de los 7 días posteriores a la compra.</p></div></div>'));

    screen.appendChild(el('<p class="fine-print"><b>Tu información está segura.</b> No venderemos ni alquilaremos tu información personal para fines de marketing.</p>'));
  };

  RENDERERS['end'] = function(step, screen){
    screen.appendChild(el('<div class="end-card"><span class="demo-tag">Vista previa del funnel</span><h1>Fin del recorrido interno</h1><p style="color:var(--mauve);margin-top:10px;">Los botones "Empezar plan mensual / anual" abren el checkout real de Hotmart en una pestaña nueva. Aquí termina solo la vista previa del quiz.</p></div>'));
    var btn = el('<button class="btn-primary static" style="margin-top:22px;">Reiniciar demo</button>');
    btn.onclick = function(){ STATE.i=0; STATE.answers={}; render(); };
    screen.appendChild(btn);
  };

  // Atajo de revisión: abre la URL con #id-de-pantalla (ej. #gift-anim, #checkout) para saltar directo ahí sin llenar el quiz.
  (function(){
    var jumpId = (location.hash || '').replace('#', '');
    if (jumpId){
      var idx = FLOW.findIndex(function(s){ return s.id === jumpId || s.type === jumpId; });
      if (idx > -1){
        STATE.i = idx;
        // Rellena respuestas de ejemplo para que las pantallas de diagnóstico/plan no se vean vacías.
        SYMPTOM_KEYS.forEach(function(k, i){
          var levels = ['leve','moderado','severo','muy-severo'];
          STATE.answers[k] = levels[i % levels.length];
        });
      }
    }
  })();
  render();
})();
</script>
